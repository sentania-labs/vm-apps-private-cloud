name: Configure Lab Private Cloud
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs'
    # Exact string, not an array. ARC scale sets match by NAME, so
    # [self-hosted, terraform] matches nothing in this org's pool: the job
    # would not fail, it would queue silently until GitHub timed it out
    # around 24h. This job needs the lab anyway (VCFA at
    # vcf-lab-automation.int.sentania.net, NSX and vCenter on wld02), and
    # the runner image bakes in terraform plus the lab root CA.
    # Contract: sentania-labs/homelab-runner/docs/ci-consumer-contract.md
    runs-on: lab

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      # vSphere / vRA / VCF environment-specific credentials
      TF_VAR_serviceAccountUserName: ${{ secrets.VCF_SERVICE_USER }}
      TF_VAR_serviceAccountPassword: ${{ secrets.VCF_SERVICE_PASSWORD }}
      TF_VAR_nsxServiceAccountUserName: ${{ secrets.WLD02_NSX_USER }}
      TF_VAR_nsxServiceAccountPassword: ${{ secrets.WLD02_NSX_PASS }}
      TF_VAR_vcfa_refresh_token: ${{ secrets.VCFA_API_TOKEN}}
      TF_VAR_github_access_token: ${{ secrets.REPO_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
             terraform init -migrate-state -input=false -upgrade \

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
              terraform plan -input=false -no-color \
              -var-file="envs/lab.tfvars" \
              -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan
          path: tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan

      # ARC gives one ephemeral pod per job and destroys it afterwards, so
      # this cleans something about to cease existing. Kept because it is
      # correct on any runner, but widened and made unconditional: the old
      # glob was $GITHUB_WORKSPACE/.[!.]* which matches DOTFILES ONLY, so it
      # never removed tfplan, the one file in the workspace worth removing.
      - name: Clean workspace
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
